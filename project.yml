name: SignalQuest
options:
  # Keep French as the editorial/extraction language. Runtime fallback is English
  # via CFBundleDevelopmentRegion in each app/extension Info.plist.
  developmentLanguage: fr
  # ⚠️ VÉRIFIÉ : XcodeGen 2.45.4 IGNORE silencieusement cette clé — le
  # `.pbxproj` généré garde `knownRegions = (Base, fr)`. Ce n'est pas bloquant :
  # Xcode compile de toute façon `en.lproj` à partir du String Catalog, qui
  # porte lui-même la langue. La clé est conservée pour le jour où XcodeGen la
  # supportera ; ne pas s'y fier pour la compilation.
  knownRegions: [fr, en, Base]
  bundleIdPrefix: fr.signalquest
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    # `Text("Bonjour")` en SwiftUI EST déjà un `LocalizedStringKey` : avec ce
    # réglage, le compilateur émet les chaînes et Xcode les verse dans le String
    # Catalog — sans modifier une ligne de code. C'est ce qui rend la migration
    # de ~2 000 littéraux tenable.
    SWIFT_EMIT_LOC_STRINGS: YES
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "835X2977R7"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.14.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.13.0
targets:
  SignalQuest:
    type: application
    platform: iOS
    sources:
      - path: SignalQuestApp
        excludes:
          - Resources/**
          - .claude/**
          # Glob et non un nom précis : un second fichier d'entitlements peut
          # apparaître localement pour tester CarPlay au simulateur (cf.
          # Config/Local.xcconfig et .gitignore). Sans le glob, XcodeGen
          # l'ajouterait aux sources compilées de la cible.
          - "*.entitlements"
      - path: SignalQuestApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: SignalQuestApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SignalQuestApp/Resources/Fonts
        buildPhase: resources
      - path: SignalQuestApp/Resources/market_registry_fallback.json
        buildPhase: resources
      - path: SignalQuestApp/Resources/market_location_areas.json
        buildPhase: resources
      - path: SignalQuestApp/Resources/plmn_assignment_registry.json
        buildPhase: resources
      - path: SignalQuestApp/Resources/radio_channel_registry_v1.json
        buildPhase: resources
      - path: SignalQuestApp/Resources/Localizable.xcstrings
        buildPhase: resources
      # Clés lues par le SYSTÈME (prompts de permission, nom de l'app). Une app
      # déclarée multilingue dont les prompts restent français est un motif de
      # rejet fréquent.
      - path: SignalQuestApp/Resources/InfoPlist.xcstrings
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # ⚠️ SwiftData n'existe qu'à partir d'iOS 17, et la cible est iOS 16.
        # `import SwiftData` produit un LC_LOAD_DYLIB FORT : sur un iPhone 8 en
        # iOS 16.7, dyld ne trouve pas le framework et TUE le process avant la
        # première ligne de code — l'app ne démarrait pas du tout (crash
        # TestFlight 1.0 (74), « Library not loaded: SwiftData »).
        # Le lien faible rend le framework absent-mais-toléré : les symboles
        # valent nil sous iOS 17, et personne ne les touche car TOUS les usages
        # sont derrière `@available(iOS 17, *)` avec repli JSON
        # (`CoverageSessionStoreFactory`, `SpeedtestPendingStoreFactory`).
        # Ne pas retirer sans relever IPHONEOS_DEPLOYMENT_TARGET à 17.
        OTHER_LDFLAGS: -weak_framework SwiftData
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios
        PRODUCT_NAME: SignalQuest
        INFOPLIST_FILE: SignalQuestApp/Info.plist
        # Choisi PAR CONFIGURATION via les xcconfig (SQ_ENTITLEMENTS), et non figé
        # ici : l'entitlement CarPlay ne peut pas figurer dans une archive tant
        # qu'Apple ne l'a pas accordé (la signature automatique exige que chaque
        # clé soit présente dans le profil), alors qu'il est nécessaire pour que
        # la scène CarPlay se connecte au simulateur. La substitution de variables
        # ne suffit pas : elle change une VALEUR, elle ne peut pas faire
        # disparaître une clé. D'où deux fichiers.
        CODE_SIGN_ENTITLEMENTS: $(SQ_ENTITLEMENTS)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Info.plist référence $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) :
        # sans ces réglages, toute archive porterait 1.0 (1) en dur et App Store
        # Connect refuserait le 2e upload. DOIVENT rester alignés sur ceux de
        # SignalQuestWidget — Apple rejette une extension dont la version diffère
        # de l'app hôte.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta
    preBuildScripts:
      - name: Validate Build Environment
        path: ci_scripts/validate_build_environment.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/SignalQuestApp
    postBuildScripts:
      # Sans upload des dSYM, les rapports Crashlytics arrivent non symbolisés
      # (adresses mémoire au lieu de noms de fonctions) et sont inexploitables.
      # Phase de FIN de build (et non postCompile) : les dSYM et l'Info.plist
      # traité n'existent qu'à ce moment — les déclarer en entrée d'une phase
      # antérieure crée un cycle de dépendances.
      - name: Upload Crashlytics dSYM
        path: ci_scripts/upload_crashlytics_dsym.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/SignalQuestApp/GoogleService-Info.plist
    dependencies:
      - package: LiveKit
        product: LiveKit
      # FirebaseMessaging (push FCM, importé dans AppDelegate) tire FirebaseCore :
      # pas besoin de lier FirebaseAnalytics (retiré — collecte sans consentement +
      # ~9,4 Mo de SDK, dont le SDK publicitaire, embarqués pour rien). Doit rester
      # déclaré ici, sinon `xcodegen generate` retire le lien (module non résolu).
      - package: Firebase
        product: FirebaseMessaging
      # Crash reporting en production. Auto-initialisé après FirebaseApp.configure().
      # (L'upload des dSYM se fait via une étape CI dédiée — cf. plan T1-11.)
      - package: Firebase
        product: FirebaseCrashlytics
      # Extension widget (embarquée dans l'app).
      - target: SignalQuestWidget
        embed: true
      - target: SignalQuestNotificationService
        embed: true
  SignalQuestNotificationService:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SignalQuestNotificationService
        excludes:
          - "*.entitlements"
          - PrivacyInfo.xcprivacy
          - Localizable.xcstrings
      - path: SignalQuestNotificationService/Localizable.xcstrings
        buildPhase: resources
      - path: SignalQuestNotificationService/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SignalQuestApp/Core/Shared/E2EEV2NotificationContracts.swift
      - path: SignalQuestApp/Core/Shared/E2EEV2NotificationRuntime.swift
      - path: SignalQuestApp/Core/Shared/E2EEV2NotificationProcessor.swift
      - path: SignalQuestApp/Core/Shared/E2EEV2NotificationContextStore.swift
      - path: SignalQuestApp/Core/Security/KeychainStore.swift
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.notification-service
        PRODUCT_NAME: SignalQuestNotificationService
        INFOPLIST_FILE: SignalQuestNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: SignalQuestNotificationService/SignalQuestNotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.notification-service
  SignalQuestWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SignalQuestWidget
        excludes:
          - PrivacyInfo.xcprivacy
          - Localizable.xcstrings
      # Une extension a son propre bundle : catalogue séparé.
      - path: SignalQuestWidget/Localizable.xcstrings
        buildPhase: resources
      # Manifeste de confidentialité PROPRE à l'extension : Apple en exige un par
      # bundle, celui de l'app hôte ne couvre pas le widget.
      - path: SignalQuestWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SignalQuestApp/Core/Shared/WidgetSharedStore.swift
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: SignalQuestWidget/Info.plist
      properties:
        CFBundleDisplayName: SignalQuest
        CFBundleDevelopmentRegion: en
        # XcodeGen écrit sinon les littéraux "1.0"/"1" dans le plist généré, et
        # les MARKETING_VERSION/CURRENT_PROJECT_VERSION ci-dessous n'ont alors
        # AUCUN effet : l'extension resterait en 1.0 (1) pendant que l'app hôte
        # s'incrémente, ce qu'App Store Connect refuse.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.widget
        PRODUCT_NAME: SignalQuestWidget
        CODE_SIGN_ENTITLEMENTS: SignalQuestWidget/SignalQuestWidget.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.widget
  SignalQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SignalQuestTests
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.tests
        INFOPLIST_FILE: SignalQuestTests/Info.plist
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.tests
    dependencies:
      - target: SignalQuest
  SignalQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SignalQuestUITests
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.uitests
        INFOPLIST_FILE: SignalQuestUITests/Info.plist
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.uitests
    dependencies:
      - target: SignalQuest
schemes:
  SignalQuest:
    build:
      targets:
        SignalQuest: all
    test:
      config: Debug
      targets:
        - SignalQuestTests
        - SignalQuestUITests
      gatherCoverageData: true
      # Langue VERROUILLÉE sur le français. Plusieurs tests assertent le texte
      # exact rendu à l'utilisateur (message d'erreur serveur non divulgué,
      # descriptions d'accessibilité de la carte). Sans ce verrou, ils suivent
      # la langue du simulateur : ils passaient tant que le français était la
      # seule localisation, et 8 sont tombés le jour où l'anglais est arrivé.
      language: fr
      region: FR
    run:
      config: Debug
      storeKitConfiguration: SignalQuest.storekit
    archive:
      config: Release
  SignalQuest Beta:
    build:
      targets:
        SignalQuest: all
    test:
      config: Staging
      targets:
        - SignalQuestTests
        - SignalQuestUITests
      gatherCoverageData: true
      language: fr
      region: FR
    run:
      config: Staging
    archive:
      config: Staging
