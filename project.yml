name: SignalQuest
options:
  developmentLanguage: fr
  bundleIdPrefix: fr.signalquest
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "835X2977R7"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.14.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.13.0
targets:
  SignalQuest:
    type: application
    platform: iOS
    sources:
      - path: SignalQuestApp
        excludes:
          - Resources/**
          - .claude/**
          - SignalQuest.entitlements
      - path: SignalQuestApp/Resources/Assets.xcassets
        buildPhase: resources
      - path: SignalQuestApp/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SignalQuestApp/Resources/Fonts
        buildPhase: resources
      - path: SignalQuestApp/Resources/market_registry_fallback.json
        buildPhase: resources
      - path: SignalQuestApp/Resources/market_location_areas.json
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios
        PRODUCT_NAME: SignalQuest
        INFOPLIST_FILE: SignalQuestApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: SignalQuestApp/SignalQuest.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Info.plist référence $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION) :
        # sans ces réglages, toute archive porterait 1.0 (1) en dur et App Store
        # Connect refuserait le 2e upload. DOIVENT rester alignés sur ceux de
        # SignalQuestWidget — Apple rejette une extension dont la version diffère
        # de l'app hôte.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta
    preBuildScripts:
      - name: Validate Build Environment
        path: ci_scripts/validate_build_environment.sh
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Sans upload des dSYM, les rapports Crashlytics arrivent non symbolisés
      # (adresses mémoire au lieu de noms de fonctions) et sont inexploitables.
      # Phase de FIN de build (et non postCompile) : les dSYM et l'Info.plist
      # traité n'existent qu'à ce moment — les déclarer en entrée d'une phase
      # antérieure crée un cycle de dépendances.
      - name: Upload Crashlytics dSYM
        path: ci_scripts/upload_crashlytics_dsym.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/SignalQuestApp/GoogleService-Info.plist
    dependencies:
      - package: LiveKit
        product: LiveKit
      # FirebaseMessaging (push FCM, importé dans AppDelegate) tire FirebaseCore :
      # pas besoin de lier FirebaseAnalytics (retiré — collecte sans consentement +
      # ~9,4 Mo de SDK, dont le SDK publicitaire, embarqués pour rien). Doit rester
      # déclaré ici, sinon `xcodegen generate` retire le lien (module non résolu).
      - package: Firebase
        product: FirebaseMessaging
      # Crash reporting en production. Auto-initialisé après FirebaseApp.configure().
      # (L'upload des dSYM se fait via une étape CI dédiée — cf. plan T1-11.)
      - package: Firebase
        product: FirebaseCrashlytics
      # Extension widget (embarquée dans l'app).
      - target: SignalQuestWidget
        embed: true
  SignalQuestWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SignalQuestWidget
        excludes:
          - PrivacyInfo.xcprivacy
      # Manifeste de confidentialité PROPRE à l'extension : Apple en exige un par
      # bundle, celui de l'app hôte ne couvre pas le widget.
      - path: SignalQuestWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SignalQuestApp/Core/Shared/WidgetSharedStore.swift
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: SignalQuestWidget/Info.plist
      properties:
        CFBundleDisplayName: SignalQuest
        # XcodeGen écrit sinon les littéraux "1.0"/"1" dans le plist généré, et
        # les MARKETING_VERSION/CURRENT_PROJECT_VERSION ci-dessous n'ont alors
        # AUCUN effet : l'extension resterait en 1.0 (1) pendant que l'app hôte
        # s'incrémente, ce qu'App Store Connect refuse.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.widget
        PRODUCT_NAME: SignalQuestWidget
        CODE_SIGN_ENTITLEMENTS: SignalQuestWidget/SignalQuestWidget.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.widget
  SignalQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SignalQuestTests
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.tests
        INFOPLIST_FILE: SignalQuestTests/Info.plist
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.tests
    dependencies:
      - target: SignalQuest
  SignalQuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SignalQuestUITests
    configFiles:
      Debug: Config/Debug.xcconfig
      Staging: Config/Staging.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.uitests
        INFOPLIST_FILE: SignalQuestUITests/Info.plist
      configs:
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: fr.signalquest.ios.beta.uitests
    dependencies:
      - target: SignalQuest
schemes:
  SignalQuest:
    build:
      targets:
        SignalQuest: all
    test:
      config: Debug
      targets:
        - SignalQuestTests
        - SignalQuestUITests
      gatherCoverageData: true
    run:
      config: Debug
      storeKitConfiguration: SignalQuest.storekit
    archive:
      config: Release
  SignalQuest Beta:
    build:
      targets:
        SignalQuest: all
    test:
      config: Staging
      targets:
        - SignalQuestTests
        - SignalQuestUITests
      gatherCoverageData: true
    run:
      config: Staging
    archive:
      config: Staging
